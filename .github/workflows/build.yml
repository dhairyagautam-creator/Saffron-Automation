name: Build (Windows + macOS)

# Builds BOTH platform artifacts from one source/version on native runners.
# This workflow only *builds and uploads artifacts* -- it never creates a
# GitHub Release. It is manually triggerable now (workflow_dispatch) and
# already prepared for future tag-driven builds (push: tags). Wiring an
# actual release (softprops/action-gh-release etc.) is a deliberate later
# step, intentionally omitted here.
on:
  workflow_dispatch:
  push:
    # A push to develop or tags builds BOTH artifacts (no release, no tag
    # creation) -- see the windows job's `if:` below, which keeps its
    # trigger scope exactly this, unchanged. `development` was added
    # (macOS port work) for the macos job only: it's the actual active
    # branch in this repo (tracked to origin/review-system-sync-slice, NOT
    # origin/develop -- a pre-existing branch-name mismatch, not something
    # introduced here), and wasn't covered by any trigger before this.
    branches:
      - develop
      - development
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Windows build + installer
    runs-on: windows-latest
    # Keeps this job's trigger scope exactly what it was before `development`
    # was added to the shared push.branches list above (that addition was
    # for the macos job only) -- explicit equality on `develop`, not
    # startsWith, because `refs/heads/develop` is a string-prefix of
    # `refs/heads/development` and would otherwise wrongly match it too.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # .env is gitignored but PyInstaller bundles it (datas=[('.env','.')]).
      # Write it from secrets; empty secrets just yield an empty (valid) file.
      - name: Write .env
        shell: pwsh
        run: |
          "SUPABASE_URL=${{ secrets.SUPABASE_URL }}`nSUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}`n" | Out-File -FilePath .env -Encoding utf8 -NoNewline

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from app.version import APP_VERSION; print(APP_VERSION)"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Windows app (PyInstaller)
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean "Saffron Automation.spec"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\saffron_validator.iss"

      - name: Stage artifact with platform name
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\release | Out-Null
          $src = "installer_output\Saffron Automation Setup v${{ steps.ver.outputs.version }}.exe"
          Copy-Item $src "dist\release\Saffron-Automation-Windows-${{ steps.ver.outputs.version }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Saffron-Automation-Windows-${{ steps.ver.outputs.version }}
          path: dist/release/Saffron-Automation-Windows-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

  macos:
    name: macOS build + dmg
    runs-on: macos-latest
    # secrets.X != '' isn't valid directly inside a step-level `if:` in this
    # repo's configuration (GitHub rejects the whole workflow file at parse
    # time with "Unrecognized named-value: 'secrets'" -- pre-existing since
    # ee2296c, never caught before because this workflow had never actually
    # been triggered until now). env IS valid in step `if:`, so compute the
    # presence check once here instead.
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      # First step, unconditionally, so the logs-upload step at the bottom
      # (if: always()) has somewhere to write even if a step below fails
      # before ever creating this directory itself.
      - name: Prepare log directory
        run: mkdir -p ci-logs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write .env
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_ANON_KEY }}" > .env

      - name: Read app version
        id: ver
        run: echo "version=$(python -c 'from app.version import APP_VERSION; print(APP_VERSION)')" >> "$GITHUB_OUTPUT"

      # Installs into the runner's system Python (not build_app.sh's own
      # .venv-mac) so pytest and the smoke test below run with the same
      # interpreter setup-python just configured. build_app.sh still does
      # its own isolated `pip install -r requirements.txt` into .venv-mac
      # further down -- that's deliberate (see its own comment: local/CI
      # build parity), so requirements do get installed twice, harmlessly.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run test suite
        run: |
          set -euo pipefail
          python -m pytest -q 2>&1 | tee ci-logs/pytest.log

      # Headless: no MainWindow()/mainloop() (see main.py's smoke_test
      # branch) -- initializes the DB, runs startup migrations, resolves
      # app/config.py's paths, and imports every sync + email-authority
      # service module, without needing a display or real Supabase
      # credentials. Runs before the PyInstaller build so a startup-path
      # break fails fast instead of only showing up in a built .app.
      - name: Run headless smoke test
        run: |
          set -euo pipefail
          python main.py --smoke-test 2>&1 | tee ci-logs/smoke_test.log

      # Import the Developer ID Application certificate into a throwaway
      # keychain so codesign (invoked by build_app.sh) can find it by
      # identity. Skipped (build falls back to ad-hoc signing -- see
      # build_app.sh) if the cert secret isn't configured yet, so this
      # workflow keeps working before signing is set up. Runner is ephemeral
      # but the keychain is still deleted in a final cleanup step, matching
      # standard CI cert-handling practice.
      - name: Import signing certificate
        if: ${{ env.HAS_MACOS_CERT == 'true' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      # Reuse the same build definition a developer runs locally so CI and
      # local builds can never drift. SIGN_IDENTITY/notarization secrets are
      # empty no-ops until configured (see README section this PR adds) --
      # the build still succeeds, just ad-hoc signed and unnotarized.
      - name: Build .app and .dmg
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.APPLE_API_KEY }}" ]; then
            echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$APPLE_API_KEY_PATH"
          fi
          chmod +x build_app.sh
          ./build_app.sh 2>&1 | tee ci-logs/build_app.log

      - name: Clean up signing keychain
        if: ${{ always() && env.HAS_MACOS_CERT == 'true' }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # if: always() + if-no-files-found: warn (not error) -- on a failed
      # build there's no .dmg yet, and that's not a reason to fail this
      # upload step too; the job is already red from whichever step failed.
      - name: Upload .dmg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saffron-Automation-macOS-${{ steps.ver.outputs.version }}
          path: dist/release/Saffron-Automation-macOS-${{ steps.ver.outputs.version }}.dmg
          if-no-files-found: warn

      - name: Upload build/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saffron-Automation-macOS-logs-${{ steps.ver.outputs.version }}
          path: ci-logs/
          if-no-files-found: warn
